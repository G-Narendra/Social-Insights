services:
  - type: web
    name: social-insights-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: INTERNAL_SECRET
        generateValue: true
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: HF_HOME
        value: /tmp/huggingface
      - key: SENTENCE_TRANSFORMERS_HOME
        value: /tmp/sbert
      - key: TORCH_NUM_THREADS
        value: "1"

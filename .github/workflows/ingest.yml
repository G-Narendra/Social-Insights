name: Scheduled Ingestion Job

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      keyword:
        description: "Target keyword to ingest"
        required: false
        default: "Toyota"

jobs:
  run-ingestion:
    name: Execute Ingestion Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Internal Ingestion API
        env:
          API_URL: ${{ secrets.SOCIAL_INSIGHTS_API_URL }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          KEYWORD: ${{ github.event.inputs.keyword || 'Toyota' }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "SOCIAL_INSIGHTS_API_URL secret not configured. Skipping remote trigger."
            exit 0
          fi
          echo "Triggering ingestion for keyword: $KEYWORD on $API_URL"
          curl -f -X POST "$API_URL/internal/ingest?keyword=$KEYWORD" \
            -H "X-Internal-Secret: $INTERNAL_SECRET" \
            -H "Content-Type: application/json"
